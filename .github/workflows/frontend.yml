name: frontend

on:
  pull_request:
    paths: ['frontend/**', 'docs/api/openapi.yaml', '.github/workflows/frontend.yml']
  push:
    branches: [dev, main]
    paths: ['frontend/**', 'docs/api/openapi.yaml', '.github/workflows/frontend.yml']

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # version 은 frontend/package.json 의 packageManager 를 따른다.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:api
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # NEXT_PUBLIC_DEMO_MODE 는 두지 않는다(운영 빌드와 같은 조건).
      - run: pnpm build
      - run: pnpm check:bundle
      # E2E(pnpm e2e)는 여기서 돌리지 않는다. local,demo 프로필 백엔드(MySQL·Redis 컨테이너 포함)와
      # 데모 관리자 비밀번호가 필요해서, 로컬에서 백엔드를 띄운 뒤 pnpm e2e 로 실행한다(README 참고).
