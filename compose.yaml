# 값은 같은 디렉터리의 .env에서 읽는다(docker compose가 자동으로 로드).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
  redis:
    image: redis:7.4
    ports:
      - "${REDIS_PORT}:6379"
