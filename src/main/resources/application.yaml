spring:
  application:
    name: kairos-api
  config:
    # 프로젝트 루트의 .env를 프로퍼티로 읽는다. 없으면 OS 환경변수만 사용한다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: Asia/Seoul
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

# Actuator는 서비스 포트(8080)와 분리된 관리 포트(8081)에서만 노출한다.
# 로컬 개발·Prometheus 수집 전용이며, 운영에서는 외부에 공개하지 않는다(내부망/방화벽으로 차단).
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0  # exporter는 두지 않는다(수집기 연동은 Phase 5). traceId 생성/전파만 한다.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

server:
  tomcat:
    mbeanregistry:
      enabled: true

# 콘솔은 사람이 읽는 형식, 파일은 JSON(ECS). ECS 파일 로그에는 MDC 키가 최상위 traceId/spanId 필드로 포함된다.
# 로그 레벨 기본값은 운영 안전값(INFO)이다. 환경변수로 덮어쓸 수 있다(Spring relaxed binding).
# 예: LOGGING_LEVEL_COM_DOGYUN_KAIROS=DEBUG, LOGGING_LEVEL_ORG_HIBERNATE_SQL=DEBUG
# 프로필별 값은 application-local.yaml, application-prod.yaml 참고(기본으로 활성화하는 프로필은 없다).
logging:
  level:
    root: INFO
    com.dogyun.kairos: INFO
  file:
    name: logs/kairos.log
  structured:
    format:
      file: ecs

kairos:
  file:
    local-dir: ${KAIROS_FILE_DIR:uploads}
    base-url: ${KAIROS_FILE_BASE_URL:http://localhost:8080}
  jwt:
    # 기본값을 두지 않는다. .env 또는 환경변수로 반드시 주입한다(256bit 이상).
    secret: ${KAIROS_JWT_SECRET}
    access-ttl: 30m
    refresh-ttl: 14d
  admin:
    email: ${KAIROS_ADMIN_EMAIL}
    password: ${KAIROS_ADMIN_PASSWORD}
  order:
    payment-ttl: 15m
    free-shipping-threshold: 50000
    base-shipping-fee: 3000
    auto-confirm-after: 7d
    in-progress-timeout: 5m
    cancel-request-timeout: 1m
    return-window: 7d
    return-auto-approve-after: 3d
    return-shipping-fee: 3000
  benefit:
    earn-rate-bp: 100
    min-usable-balance: 1000
    use-unit: 10
    max-use-rate-bp: 3000
    earn-expiry: 365d
    refund-lot-expiry: 30d
    review-reward-text: 100
    review-reward-photo: 500
  review:
    write-deadline: 90d
  settlement:
    late-confirm-lookback: 28d
    # 월요일이어야 한다. 운영 배포 전에 확정한다.
    start-date: 2026-11-16
  jobs:
    enabled: true
    order-expiry-delay: 60s
    payment-reconcile-delay: 60s
    delivery-poll-delay: 10m
    auto-confirm-delay: 1h
    idempotency-cleanup-delay: 1h
    point-expiry-delay: 1h
    return-auto-approve-delay: 1h
    settlement-generate-cron: "0 0 3 * * MON"
  idempotency:
    ttl: 24h
    in-progress-timeout: 60s
  delivery:
    provider: ${KAIROS_DELIVERY_PROVIDER:mock}
    sweet-tracker:
      api-key: ${SWEETTRACKER_API_KEY:}
  pg:
    provider: ${KAIROS_PG_PROVIDER:mock}
    toss:
      secret-key: ${TOSS_SECRET_KEY:}
