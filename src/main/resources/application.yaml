spring:
  application:
    name: kairos-api
  datasource:
    url: jdbc:mysql://localhost:3306/kairos
    username: kairos
    password: kairos
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
