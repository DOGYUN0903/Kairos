spring:
  application:
    name: kairos-api
  config:
    # 프로젝트 루트의 .env를 프로퍼티로 읽는다. 없으면 OS 환경변수만 사용한다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jackson:
    time-zone: Asia/Seoul
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

# Actuator는 서비스 포트(8080)와 분리된 관리 포트(8081)에서만 노출한다.
# 로컬 개발·Prometheus 수집 전용이며, 운영에서는 외부에 공개하지 않는다(내부망/방화벽으로 차단).
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0  # exporter는 두지 않는다(수집기 연동은 Phase 5). traceId 생성/전파만 한다.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

server:
  tomcat:
    mbeanregistry:
      enabled: true

# 콘솔은 사람이 읽는 형식, 파일은 JSON(ECS). ECS에는 trace.id/span.id가 MDC에서 자동 포함된다.
logging:
  file:
    name: logs/kairos.log
  structured:
    format:
      file: ecs

kairos:
  jwt:
    # 기본값을 두지 않는다. .env 또는 환경변수로 반드시 주입한다(256bit 이상).
    secret: ${KAIROS_JWT_SECRET}
    access-ttl: 30m
    refresh-ttl: 14d
  admin:
    email: ${KAIROS_ADMIN_EMAIL}
    password: ${KAIROS_ADMIN_PASSWORD}
  mock-pg:
    delay: 100ms
    failure-rate: 0.0
    timeout: 3s
