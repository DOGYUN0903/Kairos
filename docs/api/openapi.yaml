  /api/v1/orders:
    post:
      tags: [Order]
      operationId: createOrder
      summary: 주문 생성 (결제 대기, 재고 차감)
      description: |
        같은 SKU 는 수량을 합산한다. `expectedTotalAmount` 는 클라이언트가 본 총액(상품 금액 + 구매자 부담 배송비)이며
        현재 가격으로 계산한 총액과 다르면 409 `ORDER_PRICE_CHANGED` 다. 재고는 SKU ID 오름차순으로 조건부 차감하고,
        하나라도 부족하면 전부 롤백한다. `Idempotency-Key` 필수.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
