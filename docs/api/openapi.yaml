  /api/v1/orders:
    post:
      tags: [Order]
      operationId: createOrder
      summary: 주문 생성 (결제 대기, 재고 차감)
      description: |
        같은 SKU 는 수량을 합산한다. `expectedTotalAmount` 는 클라이언트가 본 총액(상품 금액 + 구매자 부담 배송비)이며
        현재 가격으로 계산한 총액과 다르면 409 `ORDER_PRICE_CHANGED` 다. 재고는 SKU ID 오름차순으로 조건부 차감하고,
        하나라도 부족하면 전부 롤백한다. `Idempotency-Key` 필수.
        쿠폰·포인트는 상품 쿠폰 → 장바구니 쿠폰 → 포인트 순으로 적용하고(스펙 4-2), `expectedTotalAmount` 는 할인 후 PG 결제 금액이다.
        잠금 순서는 `member_point → coupon → sku` 이며 쿠폰 사용·포인트 차감·재고 차감은 한 트랜잭션이다.
        총액이 0원이면 PG 없이 즉시 승인되어 `orderStatus=PAID`, `paymentStatus=APPROVED` 로 응답한다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 주문 생성(PENDING_PAYMENT). `expiresAt` 까지 결제하지 않으면 만료된다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          description: "`ORDER_INVALID`(항목 없음·수량 범위 밖·배송지 누락·쿠폰 ID 중복·한 SKU 에 상품 쿠폰 두 장·항목에 없는 SKU 지정), `COUPON_NOT_APPLICABLE`, `COUPON_MIN_AMOUNT_NOT_MET`, `POINT_INVALID_AMOUNT`, `POINT_EXCEEDS_LIMIT`(동시에 같은 회원의 포인트를 쓰는 주문 경합에서 진 요청도 잔액이 최소 사용 단위 1,000P 밑으로 떨어져 이 코드를 받는다), `IDEMPOTENCY_KEY_REQUIRED` 또는 `INVALID_REQUEST`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: "`ORDER_PRICE_CHANGED`, `STOCK_SOLD_OUT`, `SKU_NOT_ORDERABLE`(AVAILABLE 이 아닌 SKU, 또는 판매자가 없거나 활성이 아님), `COUPON_NOT_AVAILABLE`(사용됨·만료·동시 사용 경합), `POINT_INSUFFICIENT` 또는 `IDEMPOTENCY_IN_PROGRESS`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
    get:
      tags: [Order]
      operationId: listMyOrders
      summary: 내 주문 목록 (최신순)
      description: 결제 대기·만료된 주문도 포함한다. 항목이 여러 개면 `firstProductName` 은 첫 항목의 상품명이다.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 내 주문 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResponse'
                          - type: object
                            properties:
                              content:
                                type: array
                                items:
                                  $ref: '#/components/schemas/OrderSummary'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/orders/quote:
    post:
      tags: [Order]
      operationId: quoteOrder
      summary: 주문 금액 미리보기 (쿠폰·포인트 적용)
      description: |
        주문 생성과 같은 계산으로 항목별 할인·배분·`paidAmount` 와 PG 결제 금액을 돌려준다. 쿠폰 상태·포인트·재고를 바꾸지 않고
        저장하지 않으므로 `Idempotency-Key` 가 없다. `maxUsablePoints` 는 이 쿠폰 조합에서 쓸 수 있는 포인트 최대치(10P 단위)다.
        `availableCoupons`·`cartCoupons` 는 내 사용 가능한 쿠폰이며 `usable`·`expectedDiscount` 는 주문 생성과 같은 판정이다.
        상품 쿠폰의 `usable` 은 그 항목에 그 쿠폰만 썼을 때의 판정이다(한 쿠폰을 두 항목에 쓰거나 한 항목에 두 장 쓰는 것은 별도로 `ORDER_INVALID`).
        장바구니 쿠폰은 요청에 담긴 상품 쿠폰을 적용한 뒤 금액으로 판정한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteOrderRequest'
      responses:
        '200':
          description: 금액 미리보기
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderQuote'
        '400':
          description: "`COUPON_NOT_APPLICABLE`, `COUPON_MIN_AMOUNT_NOT_MET`, `POINT_INVALID_AMOUNT`, `POINT_EXCEEDS_LIMIT`, `ORDER_INVALID` 또는 `INVALID_REQUEST`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "`COUPON_NOT_FOUND`(남의 쿠폰 포함)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "`COUPON_NOT_AVAILABLE`, `POINT_INSUFFICIENT` 또는 `SKU_NOT_ORDERABLE`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
