  /api/v1/products:
    get:
      tags: [Product]
      operationId: listProducts
      summary: 상품 목록·검색 (공개)
      description: |
        노출 조건 세 가지를 모두 만족하는 상품만 나온다: 상품이 `ON_SALE`, 브랜드가 `APPROVED`, 판매자가 `APPROVED`.
        정지된 판매자나 승인되지 않은 브랜드의 상품은 목록과 상세 모두에서 보이지 않는다.
        - `categoryId`: 소분류면 그 소분류, 대분류면 아래 모든 소분류의 상품.
        - `minPrice`/`maxPrice`: 상품 판매가 기준(SKU 추가 금액 미반영). `minPrice > maxPrice` 면 `INVALID_REQUEST`.
        - `keyword`: 상품명 또는 브랜드명 부분 일치. `%`, `_` 는 문자로 취급한다. 공백만이면 무시.
        - `sort`: `LATEST`(onSaleAt 내림차순), `PRICE_ASC`/`PRICE_DESC`(판매가), `POPULAR`(판매량 내림차순, 동률은 최신순).
        품절(`soldOut`)은 ACTIVE SKU 중 판매 중이고 재고가 있는 것이 하나도 없을 때다. 재고 숫자는 노출하지 않는다.
      security: []
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: brandId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: minPrice
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: maxPrice
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: keyword
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 상품 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResponse'
                          - type: object
                            properties:
                              content:
                                type: array
                                items:
                                  $ref: '#/components/schemas/ProductSummary'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: "`CATEGORY_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Product]
      operationId: getProduct
      summary: 상품 상세 (공개)
      description: |
        노출 조건(상품 `ON_SALE`, 브랜드 `APPROVED`, 판매자 `APPROVED`)을 하나라도 만족하지 않으면 `PRODUCT_NOT_FOUND`.
        SKU는 ACTIVE만 내려주고, 재고 숫자는 노출하지 않는다(품절 여부만).
      security: []
      responses:
        '200':
          description: 상품 상세
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProductDetail'
        '404':
          description: "`PRODUCT_NOT_FOUND` 없거나 노출 조건을 만족하지 않는 상품"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
