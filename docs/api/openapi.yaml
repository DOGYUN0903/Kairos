  /api/v1/orders/{orderId}/items/{orderItemId}/reviews:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/OrderItemId'
    post:
      tags: [Review]
      operationId: writeReview
      summary: 후기 작성 (구매 확정 항목, 항목당 1개)
      description: |
        판매자 주문이 `CONFIRMED` 이고 항목이 `ORDERED` 인 내 주문 항목에만, 구매 확정 후 90일(`kairos.review.write-deadline`) 안에 쓴다.
        별점 1~5, 본문 10~1000자, 사진은 본인이 올린 이미지 최대 3장. 적립금은 글 100P, 사진 포함 500P(작성 시 한 번, 삭제해도 회수하지 않음).
        삭제한 항목에는 다시 쓸 수 없다(`UNIQUE(order_item_id)`). `Idempotency-Key` 필수.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteReviewRequest'
      responses:
        '201':
          description: 작성 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WriteReviewResponse'
        '400':
          description: "`REVIEW_INVALID` 별점·본문 길이·사진 수·소유, `INVALID_REQUEST`, `IDEMPOTENCY_KEY_REQUIRED`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "`ORDER_ITEM_NOT_FOUND` 없거나 남의 주문 항목"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "`REVIEW_NOT_ELIGIBLE` 미확정·취소 항목 또는 기한 경과, `REVIEW_ALREADY_WRITTEN` 이미 작성(삭제 포함), 또는 `IDEMPOTENCY_KEY_REUSED`/`IDEMPOTENCY_IN_PROGRESS`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
