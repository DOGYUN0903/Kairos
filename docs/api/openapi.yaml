          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '400':
          description: "`PRODUCT_INVALID_PRICE`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ChangeRequestNotFound'
        '409':
          description: "`CHANGE_REQUEST_INVALID_STATE_TRANSITION`(PENDING 이 아닌 요청) 또는 `PRODUCT_INVALID_STATE_TRANSITION`(ENDED 상품)"
          content:
