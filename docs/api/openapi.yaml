      operationId: approveChangeRequest
      summary: 변경 요청 승인 (ADMIN, PENDING → APPROVED, 상품에 반영)
      description: |
        요청한 내용과 정가를 상품에 반영하고 SKU 를 재구성한다. 같은 옵션 값 ID 조합의 SKU 는 ID·재고·추가 금액이 유지되고,
        새 조합은 재고 0 으로 생기며, 사라진 조합은 DISCONTINUED 가 된다. 상품 상태와 `onSaleAt` 은 바뀌지 않는다.
        상품이 ENDED 면 `PRODUCT_INVALID_STATE_TRANSITION` 이고 요청은 PENDING 으로 남는다.
        현재 판매가가 새 정가보다 크면 `PRODUCT_INVALID_PRICE`.
      parameters:
