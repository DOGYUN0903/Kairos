          description: "`PAYMENT_AMOUNT_MISMATCH`(금액이 주문 총액과 다름), `IDEMPOTENCY_KEY_REQUIRED` 또는 `INVALID_REQUEST`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: "`PAYMENT_REJECTED` PG 가 승인을 거절했다. 주문은 취소되고 재고가 돌아온다"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
