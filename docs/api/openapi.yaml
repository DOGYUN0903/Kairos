      summary: 주문 항목 취소 (구매자)
      description: |
        환불은 PG 부분 취소로 한다. 항목을 `CANCEL_REQUESTED` 로 바꾼 뒤 트랜잭션 밖에서 PG 를 호출하고, 성공하면 `CANCELED` 확정·재고 복구·판매량 감소를 한 트랜잭션에서 한다.
        PG 결과를 알 수 없으면 항목은 `CANCEL_REQUESTED` 로 남고(200) 정리 작업이 확정한다. PG 가 취소를 거절하면 항목은 `ORDERED` 로 돌아가고 409 `PAYMENT_CANCEL_FAILED` 다.
        이미 `CANCEL_REQUESTED`/`CANCELED` 인 항목을 다시 요청하면 PG 호출 없이 현재 상태를 200 으로 돌려준다. 다른 항목의 취소가 확인 중이면 409 `ORDER_ITEM_NOT_CANCELABLE` 이다. `Idempotency-Key` 필수.
        구매자 취소로 남은 상품 금액이 무료배송 기준 아래로 처음 떨어지면 기본 배송비 1회분을 환불에서 차감한다(`shippingFeeDeducted`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelItemRequest'
      responses:
        '200':
          description: 항목의 현재 상태(`CANCELED`, PG 결과가 불확실하면 `CANCEL_REQUESTED`)와 환불액
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CancelItemResponse'
        '400':
          description: "`INVALID_REQUEST`(사유 누락·500자 초과) 또는 `IDEMPOTENCY_KEY_REQUIRED`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: "`ORDER_NOT_FOUND`(없거나 내 주문이 아니다) 또는 `ORDER_ITEM_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "`ORDER_ITEM_NOT_CANCELABLE`(배송 시작·다른 항목 취소 확인 중), `ORDER_INVALID_STATE_TRANSITION`, `PAYMENT_CANCEL_FAILED` 또는 `IDEMPOTENCY_IN_PROGRESS`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
