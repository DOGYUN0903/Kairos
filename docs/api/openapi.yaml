  /api/v1/seller/products/{productId}/change-requests:
    post:
      tags: [Seller Change Request]
      operationId: submitChangeRequest
      summary: 상품 변경 요청 (APPROVED 판매자, ON_SALE·PAUSED 상품)
      description: |
        판매 중인 상품의 내용(이름·설명·카테고리·이미지·옵션)과 정가는 즉시 바뀌지 않고 변경 요청으로 심사를 거친다.
        상품은 요청 중에도 기존 내용 그대로 판매되며, 판매자 상세의 `pendingChangeRequestId` 로 대기 중인 요청을 알 수 있다.
        카테고리·이미지·옵션 값 ID 검증은 상품 수정과 같다. 정가는 `0 < 현재 판매가 ≤ 새 정가` 여야 한다(`PRODUCT_INVALID_PRICE`).
        상품 하나에 대기 중인 요청은 하나뿐이다(`CHANGE_REQUEST_ALREADY_PENDING`).
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitChangeRequestRequest'
      responses:
        '201':
          description: 변경 요청 생성 (PENDING)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SubmitChangeRequestResponse'
        '400':
          description: "`PRODUCT_INVALID`, `PRODUCT_INVALID_PRICE`, `CATEGORY_NOT_LEAF`, `FILE_NOT_OWNED` 또는 `INVALID_REQUEST`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: "`PRODUCT_NOT_FOUND` 또는 `CATEGORY_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "`CHANGE_REQUEST_ALREADY_PENDING`, `PRODUCT_INVALID_STATE_TRANSITION`(ON_SALE·PAUSED 가 아닌 상품) 또는 `SELLER_NOT_ACTIVE`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
