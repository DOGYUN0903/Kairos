          $ref: '#/components/responses/Forbidden'
        '404':
          description: "`CATEGORY_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "`CATEGORY_HAS_CHILDREN` 하위 카테고리가 있다, `CATEGORY_HAS_PRODUCTS` 상품이 있다"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/seller/products:
    post:
      tags: [Seller Product]
      operationId: registerProduct
      summary: 상품 등록 (APPROVED 판매자, PENDING_REVIEW 로 시작)
      description: |
        브랜드는 내 소유(아니면 `BRAND_NOT_FOUND`)이고 APPROVED(아니면 `BRAND_NOT_APPROVED`)여야 한다.
        카테고리는 소분류만(`CATEGORY_NOT_LEAF`), 이미지는 본인이 올린 이미지 파일만(`FILE_NOT_OWNED`).
        옵션 값 조합마다 SKU 가 재고 0·추가 금액 0·판매 중으로 생성된다. 옵션이 없으면 SKU 하나.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterProductRequest'
      responses:
        '201':
          description: 등록 완료 (PENDING_REVIEW)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RegisterProductResponse'
        '400':
          description: "`PRODUCT_INVALID`, `PRODUCT_INVALID_PRICE`, `CATEGORY_NOT_LEAF`, `FILE_NOT_OWNED` 또는 `INVALID_REQUEST`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: "`BRAND_NOT_FOUND` 또는 `CATEGORY_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "`BRAND_NOT_APPROVED` 또는 `SELLER_NOT_ACTIVE`"
