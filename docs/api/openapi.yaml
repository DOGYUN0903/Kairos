  /api/v1/admin/settlements/generate:
    post:
      tags: [Admin Settlement]
      operationId: generateSettlements
      summary: 주간 정산 생성 (ADMIN)
      description: |
        `periodStart`(월요일) 주간 기간 `[periodStart 00:00, periodStart+7일 00:00)`(KST)의 정산을 판매자별 트랜잭션으로 만든다.
        끝나지 않은 기간, `kairos.settlement.start-date` 이전 기간, 직전 기간이 아직 생성되지 않은 기간은 400 `SETTLEMENT_PERIOD_INVALID` 다(오래된 기간부터).
        이미 생성 완료(`settlement_run`)된 기간이면 아무것도 만들지 않고 `alreadyGenerated=true` 로 응답한다.
        일부 판매자가 실패하면 `failedCount > 0` 이고 완료 기록을 남기지 않는다(다시 요청하면 나머지만 만든다). `Idempotency-Key` 필수.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSettlementRequest'
      responses:
        '200':
          description: 생성 결과
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GenerateSettlementResult'
        '400':
          description: "`SETTLEMENT_PERIOD_INVALID`, `IDEMPOTENCY_KEY_REQUIRED` 또는 `INVALID_REQUEST`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: "`IDEMPOTENCY_IN_PROGRESS`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
  /api/v1/admin/sellers/{sellerId}/settlement-adjustments:
    parameters:
      - name: sellerId
        in: path
        required: true
        schema:
