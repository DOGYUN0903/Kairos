        판매자에게 가감 금액(양수 가산, 음수 차감)을 등록한다. 정지·탈퇴 판매자도 등록할 수 있다.
        등록한 조정은 `created_at` 이 정산 기간 끝보다 이른 가장 가까운 다음 정산 생성 때 그 정산에 붙는다(기간 끝 뒤 등록분은 그 다음 정산).
        `Idempotency-Key` 필수.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSettlementAdjustmentRequest'
      responses:
        '201':
          description: 조정 등록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreateSettlementAdjustmentResponse'
        '400':
          description: "`SETTLEMENT_ADJUSTMENT_INVALID`(금액 0, 사유 비어 있음·500자 초과), `IDEMPOTENCY_KEY_REQUIRED` 또는 `INVALID_REQUEST`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: "`SELLER_NOT_FOUND`"
          content:
