  /api/v1/payments/confirm:
    post:
      tags: [Payment]
      operationId: confirmPayment
      summary: 결제 승인
      description: |
        토스 결제창이 돌려준 `paymentKey`, `orderNo`, `amount` 로 PG 승인을 요청한다. 결제를 `IN_PROGRESS` 로 선점한 뒤
        트랜잭션 밖에서 PG 를 호출한다. 같은 주문을 같은 `paymentKey` 로 다시 승인하면 이미 `APPROVED` 일 때는 PG 호출 없이
        현재 상태를 200 으로, `UNKNOWN` 이면 200(`paymentStatus: UNKNOWN`)으로, 진행 중이면 409 `PAYMENT_IN_PROGRESS` 로 답한다.
        PG 결과를 알 수 없으면 결제는 `UNKNOWN`, 주문은 `PENDING_PAYMENT` 로 남고 대사 작업이 확정한다. `Idempotency-Key` 필수.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
      responses:
        '200':
          description: 승인 처리 결과(`paymentStatus` 가 `APPROVED` 또는 `UNKNOWN`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ConfirmPaymentResponse'
