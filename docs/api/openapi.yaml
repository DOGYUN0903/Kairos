        '404':
          $ref: '#/components/responses/ChangeRequestNotFound'
        '409':
          description: "`CHANGE_REQUEST_INVALID_STATE_TRANSITION`(PENDING 이 아닌 요청) 또는 `PRODUCT_INVALID_STATE_TRANSITION`(ENDED 상품)"
          content:
