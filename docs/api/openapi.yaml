        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryOrderRequest'
      responses:
        '200':
          description: 처리 완료 (`data`는 null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '400':
          description: "`INVALID_REQUEST` 또는 `CATEGORY_INVALID` ID 목록이 부모 아래 카테고리와 정확히 일치하지 않는다"
