                                  $ref: '#/components/schemas/SettlementAdjustmentResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: "`SELLER_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/settlement-adjustments/{adjustmentId}:
    delete:
      tags: [Admin Settlement]
      operationId: deleteSettlementAdjustment
      summary: 정산 조정 삭제 (ADMIN, 소프트 삭제)
      description: |
        아직 정산에 붙지 않은 `MANUAL` 조정만 지울 수 있다. 정산에 붙은 조정과 시스템이 만든 `CARRY_OVER` 는 바꿀 수 없다(409).
        붙이기와 삭제는 조건부 UPDATE 로 직렬화되어 둘 중 하나만 성공한다.
      parameters:
        - $ref: '#/components/parameters/AdjustmentId'
      responses:
        '204':
          description: 삭제 완료 (본문 없음)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: "`SETTLEMENT_NOT_FOUND` 없거나 이미 삭제됨"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
