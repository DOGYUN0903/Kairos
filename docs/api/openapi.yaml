      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Seller Product]
      operationId: getMyProduct
      summary: 내 상품 상세 (APPROVED·SUSPENDED 판매자, ACTIVE·DISCONTINUED SKU 모두)
