    post:
      tags: [Return]
      operationId: requestReturn
      summary: 반품 요청 (구매자)
      description: |
        `DELIVERED` 판매자 주문의 `ORDERED` 항목에, 배송 완료 후 `kairos.order.return-window`(7일) 안에 요청한다.
        철회(`WITHDRAWN`)한 반품은 같은 행(같은 returnId)을 `REQUESTED` 로 되살린다. 거절된 항목은 다시 요청할 수 없다. `Idempotency-Key` 필수.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestReturnRequest'
      responses:
        '201':
          description: 요청된 반품
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReturnRequestResponse'
        '400':
          description: "`RETURN_INVALID`(사유·상세 길이), `INVALID_REQUEST` 또는 `IDEMPOTENCY_KEY_REQUIRED`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "`ORDER_NOT_FOUND`(없거나 내 주문이 아니다) 또는 `ORDER_ITEM_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "`RETURN_NOT_ELIGIBLE`(배송 완료 전·구매 확정 뒤·취소 항목), `RETURN_WINDOW_EXPIRED`, `RETURN_ALREADY_REQUESTED` 또는 `IDEMPOTENCY_IN_PROGRESS`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
