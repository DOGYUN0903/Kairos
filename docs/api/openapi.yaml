      description: |
        판매 중인 상품의 내용은 변경 요청(`/change-requests`)으로만 바꾼다.
        `optionId`·`valueId` 를 유지한 옵션 값의 SKU 는 그대로 남고, 사라진 조합의 SKU 는 DISCONTINUED 가 된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductContentRequest'
      responses:
        '200':
          description: 수정 완료 (`data`는 null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '400':
          description: "`PRODUCT_INVALID`, `CATEGORY_NOT_LEAF`, `FILE_NOT_OWNED` 또는 `INVALID_REQUEST`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: "`PRODUCT_NOT_FOUND` 또는 `CATEGORY_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "`PRODUCT_INVALID_STATE_TRANSITION` 또는 `SELLER_NOT_ACTIVE`"
