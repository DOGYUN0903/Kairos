        `categoryIds` 는 그 부모 아래 (삭제되지 않은) 카테고리 전부와 정확히 일치해야 한다(중복·누락·다른 부모의 ID 는 `CATEGORY_INVALID`). 하나라도 어긋나면 아무것도 바꾸지 않는다.
