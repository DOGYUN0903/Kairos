              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "`IDEMPOTENCY_IN_PROGRESS`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
    get:
      tags: [Admin Settlement]
      operationId: listSettlementAdjustments
      summary: 판매자 정산 조정 목록 (ADMIN)
      description: 최신 등록순. `settlementId` 가 null 이면 아직 정산에 붙지 않은 조정이다.
