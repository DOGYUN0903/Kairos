openapi: 3.1.0
info:
  title: Kairos Commerce API
  version: 0.4.0
  description: |
    Kairos 타임딜 API 기준 문서(SDD). 구현이 이 문서와 다르면 문서를 먼저 고치고 커밋한다.

    C1: 판매자·브랜드·카테고리·상품·파일
    C2: 장바구니·주문·결제·취소·배송
    C3: 쿠폰·포인트·후기·좋아요

    - 모든 성공 응답 본문은 `ApiResponse`로 감싼다. 각 엔드포인트 표의 응답 값은 `data`에 들어간다.
    - 모든 에러 응답은 `ErrorResponse`.
    - 금액은 원 단위 정수(int64), 일시는 오프셋 없는 로컬 date-time(KST 기준, 예: 2026-11-08T12:00:00).
    - 모든 응답(성공/에러)에는 요청의 트레이스 ID를 담은 `X-Trace-Id` 헤더가 포함된다. 에러 문의 시 이 값을 함께 전달한다.
    - 딜 `status`는 저장값이 아니라 조회 시각 기준 계산값이다.
servers:
  - url: http://localhost:8080
    description: Local
tags:
  - name: Auth
    description: 회원가입, 로그인, 토큰 재발급, 로그아웃
  - name: Admin Deal
    description: 관리자 딜 등록/수정/삭제
  - name: Deal
    description: 딜 목록/상세 조회
  - name: Cart
  - name: Order
  - name: Payment
  - name: Seller Order
  - name: Admin Order
  - name: Seller
  - name: Admin Seller
  - name: Brand
  - name: Seller Brand
  - name: Admin Brand
  - name: File
  - name: Category
  - name: Admin Category
  - name: Product
  - name: Seller Product
  - name: Admin Product
  - name: Seller Change Request
  - name: Admin Change Request
  - name: Coupon
  - name: Seller Coupon
  - name: Admin Coupon
  - name: Point
  - name: Admin Point
  - name: Review
  - name: Seller Review
  - name: Product Like
security:
  - bearerAuth: []
paths:
  /api/v1/auth/signup:
    post:
      tags: [Auth]
      operationId: signup
      summary: 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 가입 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SignupResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: "`MEMBER_EMAIL_DUPLICATED`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: MEMBER_EMAIL_DUPLICATED
                message: 이미 사용 중인 이메일입니다.
                timestamp: '2026-11-08T12:00:00'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 토큰 발급
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: "`AUTH_INVALID_CREDENTIALS`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: AUTH_INVALID_CREDENTIALS
                message: 이메일 또는 비밀번호가 올바르지 않습니다.
                timestamp: '2026-11-08T12:00:00'
  /api/v1/auth/reissue:
    post:
      tags: [Auth]
      operationId: reissue
      summary: 토큰 재발급
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReissueRequest'
      responses:
        '200':
          description: 토큰 재발급
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: "`AUTH_INVALID_TOKEN`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: AUTH_INVALID_TOKEN
                message: 유효하지 않은 토큰입니다.
                timestamp: '2026-11-08T12:00:00'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 로그아웃 (USER)
      responses:
        '204':
          description: 로그아웃 완료 (본문 없음)
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/deals:
    post:
      tags: [Admin Deal]
      operationId: createDeal
      summary: 딜 등록 (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealRequest'
      responses:
        '201':
          description: 딜 등록 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreateDealResponse'
        '400':
          description: "`DEAL_INVALID` 또는 `INVALID_REQUEST`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: DEAL_INVALID
                message: 할인가는 정가보다 클 수 없습니다.
                timestamp: '2026-11-08T12:00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/deals/{dealId}:
    parameters:
      - $ref: '#/components/parameters/DealId'
    put:
      tags: [Admin Deal]
      operationId: updateDeal
      summary: 딜 수정 (ADMIN, 오픈 전에만)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealRequest'
      responses:
        '200':
          description: 수정 완료 (`data`는 null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '400':
          description: "`DEAL_INVALID` 또는 `INVALID_REQUEST`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DealNotFound'
        '409':
          $ref: '#/components/responses/DealAlreadyOpened'
    delete:
      tags: [Admin Deal]
      operationId: deleteDeal
      summary: 딜 삭제 (ADMIN, 소프트 딜리트, 오픈 전에만)
      responses:
        '204':
          description: 삭제 완료 (본문 없음)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DealNotFound'
        '409':
          $ref: '#/components/responses/DealAlreadyOpened'
  /api/v1/deals:
    get:
      tags: [Deal]
      operationId: listDeals
      summary: 딜 목록 (공개, 페이징)
      security: []
      parameters:
        - name: status
          in: query
          required: false
          description: 조회 시각 기준 상태 필터
          schema:
            $ref: '#/components/schemas/DealStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 딜 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResponse'
                          - type: object
                            properties:
                              content:
                                type: array
                                items:
                                  $ref: '#/components/schemas/DealSummary'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /api/v1/deals/{dealId}:
    get:
      tags: [Deal]
      operationId: getDeal
      summary: 딜 상세 (공개)
      security: []
      parameters:
        - $ref: '#/components/parameters/DealId'
      responses:
        '200':
          description: 딜 상세
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DealDetail'
        '404':
          $ref: '#/components/responses/DealNotFound'
  /api/v1/seller/application:
    post:
      tags: [Seller]
      operationId: applySeller
      summary: 입점 신청 (로그인 회원)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerApplicationRequest'
      responses:
        '201':
          description: 입점 신청 완료 (PENDING)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ApplySellerResponse'
        '400':
          description: "`SELLER_INVALID` 또는 `INVALID_REQUEST`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: "`SELLER_ALREADY_EXISTS`, `SELLER_BUSINESS_NUMBER_DUPLICATED`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                sellerAlreadyExists:
                  value:
                    code: SELLER_ALREADY_EXISTS
                    message: 이미 입점 신청한 회원입니다.
                    timestamp: '2026-11-08T12:00:00'
                businessNumberDuplicated:
                  value:
                    code: SELLER_BUSINESS_NUMBER_DUPLICATED
                    message: 이미 등록된 사업자등록번호입니다.
                    timestamp: '2026-11-08T12:00:00'
    put:
      tags: [Seller]
      operationId: updateSellerApplication
      summary: 입점 신청 수정 (PENDING 또는 REJECTED, 수정하면 PENDING으로 돌아간다)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerApplicationRequest'
      responses:
        '200':
          description: 수정 완료 (`data`는 null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '400':
          description: "`SELLER_INVALID` 또는 `INVALID_REQUEST`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SellerNotFound'
        '409':
          description: "`SELLER_INVALID_STATE_TRANSITION` 승인·정지 상태에서는 신청을 고칠 수 없다"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: SELLER_INVALID_STATE_TRANSITION
                message: 허용되지 않는 판매자 상태 전이입니다.
                timestamp: '2026-11-08T12:00:00'
  /api/v1/seller/me:
    get:
      tags: [Seller]
      operationId: getMySeller
      summary: 내 판매자 정보
      responses:
        '200':
          description: 내 판매자 정보
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SellerDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SellerNotFound'
  /api/v1/files/images:
    post:
      tags: [File]
      operationId: uploadImage
      summary: 이미지 업로드 (jpg, png, webp, 5MB 이하)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 업로드 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadImageResponse'
        '400':
          description: "`FILE_UNSUPPORTED_FORMAT`, `FILE_INVALID` 또는 `INVALID_REQUEST`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: "파일이 너무 큼 (`INVALID_REQUEST`)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/sellers:
    get:
      tags: [Admin Seller]
      operationId: listAdminSellers
      summary: 판매자 심사 목록 (ADMIN, 최신 등록순)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SellerStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 판매자 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResponse'
                          - type: object
                            properties:
                              content:
                                type: array
                                items:
                                  $ref: '#/components/schemas/SellerDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/sellers/{sellerId}/approve:
    post:
      tags: [Admin Seller]
      operationId: approveSeller
      summary: 판매자 승인 (ADMIN, PENDING만)
      parameters:
        - name: sellerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveSellerRequest'
      responses:
        '200':
          description: 처리 완료 (`data`는 null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SellerNotFound'
        '409':
          description: "`SELLER_INVALID_STATE_TRANSITION` PENDING이 아니면 승인할 수 없다"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: SELLER_INVALID_STATE_TRANSITION
                message: 허용되지 않는 판매자 상태 전이입니다.
                timestamp: '2026-11-08T12:00:00'
  /api/v1/admin/sellers/{sellerId}/reject:
    post:
      tags: [Admin Seller]
      operationId: rejectSeller
      summary: 판매자 반려 (ADMIN, PENDING만)
      parameters:
        - name: sellerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: 처리 완료 (`data`는 null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SellerNotFound'
        '409':
          description: "`SELLER_INVALID_STATE_TRANSITION` PENDING이 아니면 반려할 수 없다"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: SELLER_INVALID_STATE_TRANSITION
                message: 허용되지 않는 판매자 상태 전이입니다.
                timestamp: '2026-11-08T12:00:00'
  /api/v1/admin/sellers/{sellerId}/suspend:
    post:
      tags: [Admin Seller]
      operationId: suspendSeller
      summary: 판매자 정지 (ADMIN, APPROVED만)
      parameters:
        - name: sellerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: 처리 완료 (`data`는 null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SellerNotFound'
        '409':
          description: "`SELLER_INVALID_STATE_TRANSITION` APPROVED가 아니면 정지할 수 없다"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: SELLER_INVALID_STATE_TRANSITION
                message: 허용되지 않는 판매자 상태 전이입니다.
                timestamp: '2026-11-08T12:00:00'
  /api/v1/admin/sellers/{sellerId}/unsuspend:
    post:
      tags: [Admin Seller]
      operationId: unsuspendSeller
      summary: 판매자 정지 해제 (ADMIN, SUSPENDED만)
      parameters:
        - name: sellerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 처리 완료 (`data`는 null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SellerNotFound'
        '409':
          description: "`SELLER_INVALID_STATE_TRANSITION` SUSPENDED가 아니면 해제할 수 없다"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: SELLER_INVALID_STATE_TRANSITION
                message: 허용되지 않는 판매자 상태 전이입니다.
                timestamp: '2026-11-08T12:00:00'
  /api/v1/seller/brands:
    post:
      tags: [Seller Brand]
      operationId: applyBrand
      summary: 브랜드 입점 신청 (APPROVED 판매자)
      description: logoFileId는 본인이 업로드한 이미지 파일이어야 한다(위반 `FILE_NOT_OWNED`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandRequest'
      responses:
        '201':
          description: 신청 완료 (PENDING)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ApplyBrandResponse'
        '400':
          description: "`BRAND_INVALID`, `FILE_NOT_OWNED` 또는 `INVALID_REQUEST`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: "`BRAND_NAME_DUPLICATED` 또는 `SELLER_NOT_ACTIVE`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Seller Brand]
      operationId: listMyBrands
      summary: 내 브랜드 목록 (APPROVED·SUSPENDED 판매자)
      responses:
        '200':
          description: 내 브랜드 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BrandDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: "`SELLER_NOT_ACTIVE`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/seller/brands/{brandId}:
    put:
      tags: [Seller Brand]
      operationId: reapplyBrand
