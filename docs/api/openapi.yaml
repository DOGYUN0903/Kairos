        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitChangeRequestRequest'
      responses:
        '201':
          description: 변경 요청 생성 (PENDING)
